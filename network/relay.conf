# Fresh version 2 relay node. No owner wallet belongs on a public server.
# Use only the binary/source matching launch/identity.json and a fresh data dir.
chain=vaytria
server=1
disablewallet=1
dnsseed=0
fixedseeds=0
discover=0
listenonion=0
onlynet=ipv4
dbcache=128
par=1
[vaytria]
bind=0.0.0.0:31444
port=31444
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=31443
# Publish only P2P TCP 31444; keep wallet RPC TCP 31443 local.
# Configure independently verified peers for public launch.
